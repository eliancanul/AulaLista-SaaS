[project]
name = "aulalista-api"
version = "0.1.0"
description = "Bootstrap de la API de AulaLista SaaS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.143.1",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx2==2.13.1",
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[build-system]
requires = ["uv_build==0.12.23"]
build-backend = "uv_build"

[tool.uv]
required-version = "==0.12.23"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = ["error"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
