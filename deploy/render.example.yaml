# Reference blueprint for Render (2 real teachers cut).
# Do not connect/sync without deployment authorization.
services:
  - type: web
    name: aulalista-docentes
    runtime: python
    plan: free
    buildCommand: bash scripts/build-render.sh
    preDeployCommand: .venv/bin/alembic upgrade head
    startCommand: .venv/bin/python -m uvicorn aulalista_api.app:create_app --factory --host 0.0.0.0 --port "$PORT" --no-access-log --no-proxy-headers
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.14"
      - key: UV_VERSION
        value: "0.12.23"
      - key: NODE_VERSION
        value: "24"
      - key: AULALISTA_DOCS_ENABLED
        value: "false"
      - key: AULALISTA_DB_TIMEOUT_SECONDS
        value: "5"
      - key: AULALISTA_DATABASE_URL
        sync: false
      - key: AULALISTA_AUTH_ORIGIN
        sync: false
      - key: AULALISTA_AUTH_HMAC_KEY
        sync: false
      - key: AULALISTA_GOOGLE_CLIENT_ID
        sync: false
      # Optional: comma-separated Gmail accounts allowed to sign in (your 2 teachers)
      - key: AULALISTA_ALLOWED_EMAILS
        sync: false
      # OpenAI (real annex generation + multi-agent chat with Luna)
      - key: AULALISTA_OPENAI_ANNEXES_ENABLED
        value: "true"
      - key: AULALISTA_OPENAI_CHAT_ENABLED
        value: "true"
      - key: AULALISTA_CHAT_SCOPE_BUDGET_USD
        value: "10"
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: "gpt-6-luna"
      # SMTP (Gmail App Password for Epson Email Print)
      - key: SMTP_HOST
        value: "smtp.gmail.com"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: PRINT_FROM_EMAIL
        sync: false
      # Scheduled print jobs dispatcher
      - key: AULALISTA_PRINT_POLLER_SECONDS
        value: "60"
      - key: AULALISTA_PRINT_CRON_SECRET
        sync: false
