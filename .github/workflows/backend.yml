name: backend

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: aulalista_test
          POSTGRES_DB: aulalista_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U aulalista_test -d aulalista_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AULALISTA_DATABASE_URL: postgresql+psycopg://aulalista_test@127.0.0.1:55432/aulalista_test
      AULALISTA_TEST_DATABASE_URL: postgresql+psycopg://aulalista_test@127.0.0.1:55432/aulalista_test
      AULALISTA_TEST_ALLOW_RESET: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12.14"
          enable-cache: false
      - name: Record tested head and base
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse HEAD
          printf 'PR head: %s\nPR base: %s\n' "$PR_HEAD" "$PR_BASE"
      - name: Install locked package
        run: uv sync --locked --no-editable
      - name: Lint and format
        run: |
          uv run --locked --no-editable ruff check .
          uv run --locked --no-editable ruff format --check .
      - name: Mark fresh disposable service and migrate explicitly
        run: |
          psql -h 127.0.0.1 -p 55432 -U aulalista_test -d aulalista_test -v ON_ERROR_STOP=1 -f tests/postgres-init.sql
          uv run --locked --no-editable alembic upgrade head
          uv run --locked --no-editable alembic upgrade head
          uv run --locked --no-editable alembic current
      - name: Test installed API and configuration
        run: uv run --locked --no-editable pytest tests/test_app.py tests/test_config.py tests/test_pilot_configuration.py tests/test_pilot_runtime.py tests/test_browser_runner.py tests/test_auth_unit.py tests/test_auth_google_signature.py tests/test_web.py tests/test_web_packaging.py tests/test_planning_result.py tests/test_guided_planning.py tests/test_analytic_sections.py tests/test_generated_contract.py tests/test_openai_planning.py tests/test_promptfoo.py
      - name: Required PostgreSQL integration tests (no skip or fallback)
        run: uv run --locked --no-editable pytest tests/test_postgres.py tests/test_materials.py tests/test_plannings.py tests/test_water_fixture.py tests/test_attachment_fixtures.py tests/test_planning_edits.py tests/test_auth_integration.py tests/test_auth_proxy.py tests/test_guided_planning_integration.py tests/test_analytic_sections_integration.py tests/test_planning_generation.py tests/test_generated_routes.py tests/test_manual_generation.py tests/test_pilot_composition.py tests/test_window_generation.py
      - name: Verify PostgreSQL logs exclude private rows and parameters
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker logs "$POSTGRES_CONTAINER" > "$RUNNER_TEMP/aulalista-postgres.log" 2>&1
          uv run --locked --no-editable python tests/check_postgres_log.py "$RUNNER_TEMP/aulalista-postgres.log"
      - name: Check dependencies and package build
        run: |
          uv pip check
          uv build --no-sources
