name: web

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: web-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  # A newer commit replaces an unfinished pull request run; each push to main uses its own SHA group so no run is cancelled or dropped.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required by branch protection on main under this exact name; keep it unique across workflows.
  web-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.11@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: aulalista_test
          POSTGRES_DB: aulalista_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U aulalista_test -d aulalista_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      AULALISTA_DATABASE_URL: postgresql+psycopg://aulalista_test@127.0.0.1:55432/aulalista_test
      AULALISTA_TEST_DATABASE_URL: postgresql+psycopg://aulalista_test@127.0.0.1:55432/aulalista_test
      AULALISTA_TEST_ALLOW_RESET: "1"
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24.19.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.23"
          python-version: "3.12.14"
          enable-cache: false
      - name: Record tested head and base
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          git rev-parse HEAD
          printf 'PR head: %s\nPR base: %s\n' "$PR_HEAD" "$PR_BASE"
      - name: Install exact dependencies
        id: web_dependencies
        run: npm ci --ignore-scripts
      - name: Prepare disposable API integration service
        id: api_setup
        working-directory: .
        run: |
          uv sync --locked --no-editable
          psql -h 127.0.0.1 -p 55432 -U aulalista_test -d aulalista_test -v ON_ERROR_STOP=1 -f tests/postgres-init.sql
          uv run --locked --no-editable alembic upgrade head
      - name: State, storage and recovery tests
        run: npm test
      - name: Typecheck and production build
        id: web_build
        run: npm run build
      - name: Install pinned Playwright Chromium
        id: chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Real-browser journey tests
        id: browser_journeys
        run: npm run test:browser
      - name: Browser through real HTTP and PostgreSQL
        if: ${{ !cancelled() && steps.web_dependencies.outcome == 'success' && steps.api_setup.outcome == 'success' && steps.web_build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: .
        run: uv run --locked --no-editable pytest tests/browser_integration.py
      - name: Auth browser through real sessions and PostgreSQL
        if: ${{ !cancelled() && steps.web_dependencies.outcome == 'success' && steps.api_setup.outcome == 'success' && steps.web_build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: .
        # Only the email transport is replaced. Never export auth traces/cookies/codes.
        run: uv run --locked --no-editable pytest tests/auth_browser_integration.py
      - name: Manual pilot through real browser, auth, HTTP and PostgreSQL
        if: ${{ !cancelled() && steps.web_dependencies.outcome == 'success' && steps.api_setup.outcome == 'success' && steps.web_build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: .
        # External email and model transports are synthetic; all application gates run.
        run: uv run --locked --no-editable pytest tests/pilot_browser_integration.py
      - name: Private chat through real browser, auth, HTTP and PostgreSQL
        if: ${{ !cancelled() && steps.web_dependencies.outcome == 'success' && steps.api_setup.outcome == 'success' && steps.web_build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: .
        # Only provider/email delivery are synthetic; no real provider credentials.
        run: uv run --locked --no-editable pytest tests/chat_browser_integration.py
      - name: Guided keyboard, focus and reflow through real sessions and PostgreSQL
        if: ${{ !cancelled() && steps.web_dependencies.outcome == 'success' && steps.api_setup.outcome == 'success' && steps.web_build.outcome == 'success' && steps.chromium.outcome == 'success' }}
        working-directory: .
        env:
          ACENTA_GUIDED_A11Y_GREP: ""
        run: uv run --locked --no-editable pytest tests/guided_accessibility_browser_integration.py
      - name: Preserve synthetic browser evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acenta-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            web/test-results/browser/**
            web/test-results/integration/**
            evidence/acenta/*.png
          retention-days: 3
          include-hidden-files: false
          if-no-files-found: ignore
          compression-level: 0

      - name: Verify installed production UI wheel (no test entrypoints)
        working-directory: .
        run: |
          npm --prefix web run build
          python scripts/package_web.py
          uv build --no-sources
          uv pip install --reinstall --no-deps dist/*.whl
          .venv/bin/python tests/check_web_artifact.py
